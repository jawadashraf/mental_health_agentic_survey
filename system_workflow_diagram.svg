<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="auto" style="background-color: #ffffff; border-radius: 12px; padding: 16px; border: 1px solid #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header -->
  <text x="400" y="32" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">SCOPE AI — SYSTEM WORKFLOW ARCHITECTURE</text>

  <!-- Step 1: User & Interface -->
  <g transform="translate(30, 55)">
    <rect width="340" height="165" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="340" height="36" rx="8" fill="#2563eb"/>
    <text x="170" y="24" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Participant Chat Experience</text>
    <text x="20" y="68" font-size="13" fill="#1e3a8a">• Auto-resizing chat text boxes</text>
    <text x="20" y="94" font-size="13" fill="#1e3a8a">• Multi-line typing &amp; easy keyboard navigation</text>
    <text x="20" y="120" font-size="13" fill="#1e3a8a">• Flexible survey step skipping</text>
    <text x="20" y="144" font-size="13" fill="#1e3a8a">• Continuous progress saving</text>
  </g>

  <!-- Step 2: AI Policy Engine -->
  <g transform="translate(430, 55)">
    <rect width="340" height="165" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect width="340" height="36" rx="8" fill="#16a34a"/>
    <text x="170" y="24" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Policy-Grounded AI Assistant</text>
    <text x="20" y="68" font-size="13" fill="#14532d">• Direct integration with official policies</text>
    <text x="20" y="94" font-size="13" fill="#14532d">• References Constitution &amp; Guidelines</text>
    <text x="20" y="120" font-size="13" fill="#14532d">• Instant knowledge updates</text>
    <text x="20" y="144" font-size="13" fill="#14532d">• Reliable, policy-compliant guidance</text>
  </g>

  <!-- Connection Arrows -->
  <text x="200" y="242" font-size="20" fill="#64748b" text-anchor="middle">↓</text>
  <text x="600" y="242" font-size="20" fill="#64748b" text-anchor="middle">↓</text>

  <!-- Step 3: Safeguarding Engine -->
  <g transform="translate(30, 255)">
    <rect width="340" height="165" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <rect width="340" height="36" rx="8" fill="#dc2626"/>
    <text x="170" y="24" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Safeguarding &amp; Risk Alerts</text>
    <text x="20" y="68" font-size="13" fill="#7f1d1d">• Real-time response risk detection</text>
    <text x="20" y="94" font-size="13" fill="#7f1d1d">• Sensitive &amp; high-risk response flags</text>
    <text x="20" y="120" font-size="13" fill="#7f1d1d">• Instant email notifications to leads</text>
    <text x="20" y="144" font-size="13" fill="#7f1d1d">• Complete audit logging &amp; tracking</text>
  </g>

  <!-- Step 4: Admin Portal -->
  <g transform="translate(430, 255)">
    <rect width="340" height="165" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <rect width="340" height="36" rx="8" fill="#ca8a04"/>
    <text x="170" y="24" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Admin Portal &amp; Reporting</text>
    <text x="20" y="68" font-size="13" fill="#713f12">• Centralized admin dashboard</text>
    <text x="20" y="94" font-size="13" fill="#713f12">• Flagged session review &amp; management</text>
    <text x="20" y="120" font-size="13" fill="#713f12">• Downloadable session data reports</text>
    <text x="20" y="144" font-size="13" fill="#713f12">• Oversight &amp; safety monitoring</text>
  </g>
</svg>
